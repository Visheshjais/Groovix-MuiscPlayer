<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Groovix — Music Streaming</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap"
      rel="stylesheet"
    />

    <!-- Emoji favicon -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>"
    />

    <!--
      YouTube IFrame Player API
      ──────────────────────────
      MUST load before React mounts.
      Gives us window.YT.Player used in context/index.jsx.
      The enablejsapi=1 param and origin help avoid playback
      blocks on HTTPS / cross-origin deployments like Netlify.
    -->
    <script src="https://www.youtube.com/iframe_api"></script>
  </head>
  <body>
    <!-- Scroll progress bar — driven by scroll handler in Home.jsx -->
    <div id="scroll-bar"></div>

    <!-- React app mounts here -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
